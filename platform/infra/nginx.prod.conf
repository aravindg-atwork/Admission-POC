limit_req_zone $binary_remote_addr zone=mafsu_chat:10m rate=60r/m;

# Recovery-drill finding (2026-08-21): the old `upstream mitra_api { server
# api:8000; }` block resolves the `api` hostname ONCE, at nginx startup -
# with 2 replicas behind that one name, this pinned 100% of traffic to
# whichever replica's IP came back first, and the other replica received
# ZERO requests (verified live: 10/10 test requests all landed on one
# container). Killing that one pinned replica produced a raw 502 to the
# very next request.
#
# FIRST fix attempt (dynamic resolve: `resolver` + a variable in
# proxy_pass) was tried and reverted - it does NOT actually work for
# real failover here. At any given moment it still only has ONE resolved
# IP cached (for the resolver's `valid=` window); when that one target
# died, `proxy_next_upstream` had nothing else to retry against except
# the same dead address, so the retry failed identically. Verified live:
# killing the pinned replica produced a 502 on request 1 AND request 2
# (the second one instantly, from a cached failure) - a full outage,
# not a fix. Caught and rolled back within the same drill, not shipped
# as "working" on the strength of a config that merely looked right.
#
# What actually works for plain Docker Compose (no Swarm/K8s service
# mesh): an explicit upstream block naming each replica CONTAINER
# directly, not the shared service alias. Docker Compose keeps
# `admission-platform-api-1`/`-2` as stable, individually resolvable
# names for a fixed `replicas: 2` (confirmed live via `getent hosts`).
# This gives nginx real peer-level awareness - genuine round-robin
# across both, and proxy_next_upstream now has an ACTUAL second peer to
# fall back to. Verified: kill one replica, next request still 200s via
# the other one - see the recovery-drill log for the exact test.
#
# The tradeoff, stated plainly: this list must be kept in sync with
# `deploy.replicas` in docker-compose.prod.yml by hand - it does not
# auto-discover new replicas the way a real service mesh would. Fine for
# a fixed, deliberately-set replica count; revisit if replicas ever
# scale dynamically.
upstream mitra_api {
    server admission-platform-api-1:8000 max_fails=2 fail_timeout=5s;
    server admission-platform-api-2:8000 max_fails=2 fail_timeout=5s;
    keepalive 32;
}

# Two server blocks, deliberately:
#
#   :80  - the PUBLIC listener (mapped to the host's public interface in
#          docker-compose.prod.yml). Serves students. /admin/ and
#          /api/admin/ are explicitly blocked here - the admin console
#          transmits an admin key and student transcripts, and this whole
#          site is still plain HTTP (no domain/TLS yet - see ../CLAUDE.md's
#          "Production admin deployment is deliberately held" note). Never
#          remove these two deny blocks without TLS in front first.
#
#   :8443 - the ADMIN listener, bound in docker-compose.prod.yml to
#          "127.0.0.1:8443:8443" - the host's OWN loopback only, never
#          0.0.0.0. Not reachable from the public internet at all; reach
#          it by SSH-tunneling to the server's loopback:
#            ssh -L 8443:127.0.0.1:8443 root@159.69.210.30
#          then browse http://127.0.0.1:8443/admin/ locally. This is the
#          "SSH tunnel, no public exposure" option chosen over standing up
#          real TLS for now - revisit once the site has a domain/cert.

server {
    listen 80;
    server_tokens off;
    client_max_body_size 16k;
    root /usr/share/nginx/html;
    index index.html;

    # Admin console: blocked on the public listener. Kept ahead of the
    # general SPA/API blocks below - nginx matches the most specific
    # prefix regardless of file order, but stating it first keeps the
    # intent obvious to a future reader.
    location /admin/ {
        return 404;
    }

    location /api/admin/ {
        return 404;
    }

    # SPA routing for the new system.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The new system's own API.
    location /api/ {
        limit_req zone=mafsu_chat burst=30 nodelay;
        # See the upstream block's own comment above for why this is a
        # named upstream with both replicas listed explicitly, not a
        # bare hostname or a variable.
        proxy_pass http://mitra_api;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 2s, not the original 5s: this is a same-host Docker connection,
        # not a real network hop - measured live during the failover
        # drill, a dead replica cost ~6s of student-visible latency per
        # request (mostly this timeout) before falling back to the
        # healthy one. A same-host connect failure/refusal happens in
        # milliseconds when it happens at all; 2s is still generous
        # headroom, not a hair-trigger.
        proxy_connect_timeout 2s;
        proxy_read_timeout 95s;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # The ORIGINAL live backend/ service, kept fully reachable rather than
    # replaced - moved from port 80 to 5050 on the host (see ../CLAUDE.md),
    # reached here via host.docker.internal (see docker-compose.prod.yml's
    # extra_hosts entry). Strips the /legacy prefix before forwarding,
    # since the old service's own routes (/, /admin, /api/chat, ...) know
    # nothing about living under a subpath.
    location /legacy/ {
        proxy_pass http://host.docker.internal:5050/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }
}

server {
    listen 8443;
    server_tokens off;
    client_max_body_size 16k;
    root /usr/share/nginx/html;
    index index.html;

    # No admin block here - this listener is the whole point of the admin
    # console being reachable at all, and it's never bound to a public
    # interface (see docker-compose.prod.yml).

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://mitra_api;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
    }
}
