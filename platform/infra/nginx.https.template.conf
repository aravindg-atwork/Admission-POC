# Activate only after replacing the domain and mounting a real certificate.
# The hostname MUST match the certificate. The earlier draft said
# admissions.mafsu.in; the real institutional host is admissions.mafsu.ac.in,
# and MITRA's own subdomain is expected to be mitra.mafsu.ac.in. Set both here
# before enabling this file, or nginx serves the default vhost and the
# certificate never matches.

# Anything arriving without a hostname we recognise - a raw-IP scan, a stray
# CNAME, a hostname-less bot - is dropped without a response. Once the domain
# exists, the public reaches the assistant through the domain or not at all.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/mitra.mafsu.ac.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mitra.mafsu.ac.in/privkey.pem;
    return 444;
}

server {
    listen 80;
    server_name mitra.mafsu.ac.in;
    # Certificate renewal must stay reachable over plain HTTP; everything else
    # is redirected.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name mitra.mafsu.ac.in;

    ssl_certificate /etc/letsencrypt/live/mitra.mafsu.ac.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mitra.mafsu.ac.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'" always;

    client_max_body_size 16k;
    root /usr/share/nginx/html;

    location /api/ {
        limit_req zone=mafsu_chat burst=30 nodelay;
        # The browser now connects directly, so $remote_addr IS the student and
        # per-student rate limiting works. If a server-side proxy is ever put
        # back in front, name it here so its X-Real-IP is trusted - and ONLY
        # its, or any client could forge the rate-limit key:
        #   set_real_ip_from <that proxy address>;
        #   real_ip_header X-Real-IP;
        proxy_pass http://mitra_api/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 95s;
    }

    location /admin/ { return 404; }
    location /api/admin/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
