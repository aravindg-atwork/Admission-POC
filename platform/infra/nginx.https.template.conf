# Activate only after replacing the domain and mounting a real certificate.
server {
    listen 80;
    server_name admissions.mafsu.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admissions.mafsu.in;

    ssl_certificate /etc/letsencrypt/live/admissions.mafsu.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admissions.mafsu.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'" always;

    client_max_body_size 16k;
    root /usr/share/nginx/html;

    location /api/ {
        limit_req zone=mafsu_chat burst=30 nodelay;
        proxy_pass http://mitra_api/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 95s;
    }

    location /admin/ { return 404; }
    location /api/admin/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
