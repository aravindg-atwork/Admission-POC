# Production deployment - a STANDALONE compose file, not merged with
# docker-compose.yml. An earlier version of this file tried to override
# just the deltas (drop host ports, add the ai_platform network) via
# Compose's file-merge feature - verified live, on this actual server,
# that a bare `ports: []` override does NOT replace the base file's port
# list, it MERGES (appends) with it, silently leaving Postgres/Redis/
# Qdrant reachable from the public internet, unauthenticated. `!reset`
# (the Compose Specification's explicit override-not-merge tag) was tried
# next and ALSO didn't behave as documented on this Compose version - it
# dropped the port binding entirely instead of replacing it, including on
# `web`, which needed to keep one. Rather than keep guessing at merge-tag
# behavior on a live public server, this file just states everything
# explicitly and completely - no merge semantics to get wrong.
#
# Use with:
#   docker compose -f docker-compose.prod.yml up -d --build
name: admission-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    # No `ports:` at all - only other containers on this compose network
    # need to reach this, never the host's public interface.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrantdata:/qdrant/storage

  api:
    build:
      context: ../services/api
    env_file:
      - ../services/api/.env
    environment:
      POSTGRES_DSN: postgresql+psycopg://platform:platform@postgres:5432/platform
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      CORS_ORIGINS: https://admissions.mafsu.ac.in
      # The embedding service (docker-api-1) is a SIBLING container on
      # this same host's pre-existing ai_platform stack, reached directly
      # by its own container name over the shared network joined below -
      # no tunnel, no host.docker.internal needed (those exist to solve
      # "reach the developer's own machine," a different problem than
      # this one).
      SELFHOSTED_URL: http://docker-api-1:8000
    networks:
      - default
      - docker_ai_platform
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 768M

  shadow-reviewer:
    build:
      context: ../services/api
    command: ["python", "-m", "app.review.worker"]
    env_file:
      - ../services/api/.env
    environment:
      POSTGRES_DSN: postgresql+psycopg://platform:platform@postgres:5432/platform
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      QWEN_REVIEW_ENABLED: ${QWEN_REVIEW_ENABLED:-false}
      QWEN_REVIEW_URL: ${QWEN_REVIEW_URL:-}
      QWEN_REVIEW_API_KEY: ${QWEN_REVIEW_API_KEY:-}
      QWEN_REVIEW_MODEL: ${QWEN_REVIEW_MODEL:-qwen2.5:7b-instruct}
    networks:
      - default
      - docker_ai_platform
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256M

  web:
    build:
      context: ../services/web
    ports:
      - "80:80"
      # Admin console only - bound to the host's OWN loopback, never
      # 0.0.0.0, so it is unreachable from the public internet. Reach it
      # via SSH tunnel: `ssh -L 8443:127.0.0.1:8443 root@<host>`, then
      # browse http://127.0.0.1:8443/admin/ locally. See nginx.prod.conf's
      # own header comment for the full reasoning.
      - "127.0.0.1:8443:8443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    # Not automatic on Linux Docker (unlike Docker Desktop) - needed so
    # nginx.prod.conf's /legacy/ route can reach the live backend/
    # service, which runs directly on the HOST, not in a container.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - api

networks:
  docker_ai_platform:
    external: true

volumes:
  pgdata:
  qdrantdata:
