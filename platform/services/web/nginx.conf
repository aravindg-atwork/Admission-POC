server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing - unknown paths fall back to index.html rather than a
    # bare nginx 404, since this is a single-page app with no server-side
    # routes of its own.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Same reason as vite.config.ts's dev-server proxy: the browser only
    # ever calls a RELATIVE /api/... path (see src/api/chat.ts), and nginx
    # forwards it here, server-side, to the api container over the
    # internal Docker network - "api" resolves via Docker Compose's own
    # DNS, nothing hardcoded to a host or port a remote viewer's browser
    # would need to reach directly. This is what makes the page work
    # identically on localhost:5180 and through any public tunnel/domain
    # pointed at this same container.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
