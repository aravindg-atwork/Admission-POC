server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing - unknown paths fall back to index.html rather than a
    # bare nginx 404, since this is a single-page app with no server-side
    # routes of its own.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
